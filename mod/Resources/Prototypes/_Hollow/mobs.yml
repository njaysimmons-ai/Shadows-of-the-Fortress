# Creatures of the Otherworld. They only appear while the station is in the Otherworld,
# and dissolve when the fog returns.

- type: entity
  parent: MobFleshGolem
  id: MobHollowHusk
  name: faceless husk
  description: Something that was a person once. It has no face, only skin pulled tight where a face should be.
  components:
  - type: HollowMonster
  - type: Sprite
    color: "#9a948c"
  - type: MovementSpeedModifier
    baseWalkSpeed: 1.2
    baseSprintSpeed: 1.8
  - type: MobThresholds
    thresholds:
      0: Alive
      60: Dead

- type: entity
  parent: MobFleshClamp
  id: MobHollowCrawler
  name: rust crawler
  description: A low, skittering thing the color of old blood and corroded metal.
  components:
  - type: HollowMonster
  - type: Sprite
    color: "#7a3424"
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.2
    baseSprintSpeed: 3
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Weapons/Xeno/alien_claw_flesh3.ogg
    angle: 0
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 5

- type: entity
  parent: MobAbomination
  id: MobHollowWarden
  name: the Warden
  description: A towering shape that walks the halls of the Otherworld as if it owns them. You should not be here.
  components:
  - type: HollowMonster
  - type: Sprite
    color: "#3a2a2a"
    scale: 1.3, 1.3
  - type: MovementSpeedModifier
    baseWalkSpeed: 1
    baseSprintSpeed: 1.4
  - type: MobThresholds
    thresholds:
      0: Alive
      250: Dead
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Weapons/genhit3.ogg
    angle: 0
    animation: WeaponArcSmash
    attackRate: 0.6
    damage:
      types:
        Blunt: 25
